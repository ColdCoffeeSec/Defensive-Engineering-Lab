name: Detection tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover detection modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find modules that contain a tests/ directory
        id: find
        shell: bash
        run: |
          modules=$(find . -mindepth 2 -maxdepth 2 -type d -path './cwe-*/tests' \
            | sed 's|^\./||; s|/tests$||' | sort | jq -R . | jq -cs .)
          echo "Discovered modules: ${modules}"
          if [ "${modules}" = "[]" ]; then
            echo "::error::No tests directories found; refusing to report a green build with nothing tested."
            exit 1
          fi
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  test:
    name: pytest (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$MODULE/tests/requirements.txt"

      - name: Run detection tests
        run: python -m pytest "$MODULE/tests" -v

  all-tests-passed:
    name: All detection tests passed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every module to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Detection tests finished with result: $RESULT"
            exit 1
          fi
