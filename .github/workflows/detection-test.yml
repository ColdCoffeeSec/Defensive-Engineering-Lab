name: Detection tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover detection modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find modules that contain a tests/ directory
        id: find
        shell: bash
        run: |
          modules=$(find . -mindepth 2 -maxdepth 2 -type d \( -path './cwe-*/tests' -o -path './re-*/tests' -o -path './docs-*/tests' \) \
            | sed 's|^\./||; s|/tests$||' | sort | jq -R . | jq -cs .)
          echo "Discovered modules: ${modules}"
          if [ "${modules}" = "[]" ]; then
            echo "::error::No tests directories found; refusing to report a green build with nothing tested."
            exit 1
          fi
          echo "modules=${modules}" >> "$GITHUB_OUTPUT"

  test:
    name: pytest (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover.outputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$MODULE/tests/requirements.txt"

      - name: Run detection tests
        run: python -m pytest "$MODULE/tests" -v

  convert:
    name: pySigma conversion (cwe-078, Splunk and Microsoft 365 Defender)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cwe-078-os-command-injection/tests/requirements-conversion.txt

      - name: Install pinned backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cwe-078-os-command-injection/tests/requirements-conversion.txt

      - name: Convert the rule (no pipeline; fails on any conversion error)
        run: python cwe-078-os-command-injection/tools/convert_check.py

  convert-re-lumma:
    name: pySigma conversion (re-lumma-stealer, Splunk and Microsoft 365 Defender)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: re-lumma-stealer/tests/requirements-conversion.txt

      - name: Install pinned backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r re-lumma-stealer/tests/requirements-conversion.txt

      - name: Convert the Sigma rules (pipeline only where a package ships one; fails on any conversion error or empty result)
        run: python re-lumma-stealer/tools/convert_check.py

  all-tests-passed:
    name: All detection tests passed
    needs: [test, convert, convert-re-lumma]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every module and the conversion check to pass
        env:
          RESULT: ${{ needs.test.result }}
          CONVERT_RESULT: ${{ needs.convert.result }}
          CONVERT_RELUMMA_RESULT: ${{ needs.convert-re-lumma.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::Detection tests finished with result: $RESULT"
            exit 1
          fi
          if [ "$CONVERT_RESULT" != "success" ]; then
            echo "::error::Backend conversion finished with result: $CONVERT_RESULT"
            exit 1
          fi
          if [ "$CONVERT_RELUMMA_RESULT" != "success" ]; then
            echo "::error::re-lumma-stealer backend conversion finished with result: $CONVERT_RELUMMA_RESULT"
            exit 1
          fi
